╔══════════════════════════════════════════════════════════════════════════════╗
║                          JUST FITS - VISUAL RESUME                           ║
║                     A Tetris-Based Interactive Portfolio                     ║
╚══════════════════════════════════════════════════════════════════════════════╝

FILE: index.html
PURPOSE: Single-file deterministic Tetris autoplay demonstrating skills, 
         personality, and cultural fit through gameplay mechanics.

WHAT IT DOES:
- Automatically plays a pre-scripted 41-piece Tetris game
- Displays narrative messages when each section starts
- Shows pieces labeled with personality traits, skills, and work ethic
- Ends with "THINKER, MAKER, HACKER, LEARNER" finale
- Displays branded scoreboard with stats and contact info
- Plays Korobeiniki melody using Web Audio API

HOW IT WORKS:
1. CONFIGURATION (CONFIG object): Defines game parameters, section messages
2. TETROMINO SYSTEM (SHAPES object): 7 piece types × 4 rotations using SRS
3. DETERMINISTIC SCRIPT (SCRIPT array): 41 pre-validated pieces with position/rotation
4. GAME ENGINE: Animation loop, collision detection, piece locking
5. LINE CLEARING: Detects complete rows, removes them, applies gravity
6. SECTION MESSAGING: Triggers when currentSection !== lastSection
7. RENDERING: Canvas 2D drawing with HUD sidebar
8. AUDIO: Web Audio API synthesizes Tetris theme procedurally
9. END GAME: Shows "Keep Propelling" message → Scoreboard with branding

KEY COMPONENTS:
- Canvas: 10×20 Tetris board (360×720px) + 220px HUD sidebar
- Board State: 2D array (20 rows × 10 cols), null = empty, object = filled
- Collision Detection: Checks piece boundaries and board overlaps
- Lock Delay: 500ms grace period before piece locks
- Section System: 5 sections (0-4) with narrative progression
- Validation: All 41 pieces pre-validated (see validate_solution.js)

SECTIONS:
- Section 0 (Pieces 1-10): Propelland's 10 Principles
- Section 1 (Pieces 11-19): Good vibes only (Personality)
- Section 2 (Pieces 20-28): I build things (My Skills)
- Section 3 (Pieces 29-37): My Work Ethic
- Section 4 (Pieces 38-41): THINKER, MAKER, HACKER, LEARNER finale
  (Note: Methodical and Simplicity are in Section 2, not finale)

BRANDING:
- Colors: Propelland blue (#0f47f5) and teal (#80ecba)
- Scoreboard: Rounded corners, teal border, blue header
- HUD: Bubbly sections with blue theme, teal title

CONTROLS:
- SPACE: Start game / Pause / Resume
- R: Retry from beginning
- Auto-advances through all 41 pieces

TECHNICAL DETAILS:
- Zero dependencies: Pure vanilla JavaScript
- Single file: Works on file:// protocol (double-click to run)
- Canvas rendering: 60 FPS with requestAnimationFrame
- Retina support: 2× canvas resolution for crisp display
- Responsive: Centers on viewport, maintains aspect ratio
- File size: ~60KB uncompressed

FUTURE ENHANCEMENTS:
- Multi-line cascade finale (see TECHNICAL_DOCUMENTATION.md)
- Interactive mode toggle
- Particle effects on line clear
- Mobile responsive improvements

AUTHOR: Rocio Hernandez Rodriguez
CREATED: January 2026
VERSION: 2.0 (Section-based with finale)

For detailed technical documentation, see TECHNICAL_DOCUMENTATION.md
For development history, see agent.md
-->

    function collides(board, shape, x, y) {
      for (let row = 0; row < shape.length; row++) {
        for (let col = 0; col < shape[row].length; col++) {
          if (shape[row][col]) {
            const boardX = x + col;
            const boardY = y + row;
            
            if (boardX < 0 || boardX >= CONFIG.COLS || boardY >= CONFIG.ROWS) {
              return true;
            }
            
            if (boardY >= 0 && board[boardY][boardX] !== null) {
              return true;
            }
          }
        }
      }
      return false;
    }
    
    function lockPieceToBoard(board, shape, x, y, data) {
      const pieceId = Date.now() + Math.random(); // Unique ID for this piece
      for (let row = 0; row < shape.length; row++) {
        for (let col = 0; col < shape[row].length; col++) {
          if (shape[row][col]) {
            const boardY = y + row;
            const boardX = x + col;
            if (boardY >= 0 && boardY < CONFIG.ROWS) {
              board[boardY][boardX] = {
                type: data.type,
                label: data.label,
                section: data.section,
                pieceId: pieceId  // Track which piece this cell belongs to
              };
            }
          }
        }
      }
    }

        lastSection = currentSection;
        if (currentSection === 0) {
          showMessage(CONFIG.SECTION0_MESSAGE);
        } else if (currentSection === 1) {
          showMessage(CONFIG.SECTION1_MESSAGE);
        } else if (currentSection === 2) {
          showMessage(CONFIG.SECTION2_MESSAGE);
        } else if (currentSection === 3) {
          showMessage(CONFIG.SECTION3_MESSAGE);
        } else if (currentSection === 4) {
          showMessage(CONFIG.SECTION4_MESSAGE);
        }
      }
      
      currentPiece = {
        type: entry.type,
        rotation: entry.rotation,
        x: entry.x,
        y: 0,
        label: entry.label,
        section: entry.section,
        isKey: entry.isKey || false,
        isFinale: entry.isFinale || false,
        shape: SHAPES[entry.type][entry.rotation % SHAPES[entry.type].length]
      };
      
      // Check if spawning would cause game over (should NEVER happen)
      if (collides(board, currentPiece.shape, currentPiece.x, currentPiece.y)) {
        console.error("❌ GAME OVER: Piece spawned in collision!");
        gameState = "ended";
        return;
      }
      
      if (scriptIndex + 1 < SCRIPT.length) {
        const nextEntry = SCRIPT[scriptIndex + 1];
        nextPiece = {
          type: nextEntry.type,
          label: nextEntry.label,
          shape: SHAPES[nextEntry.type][nextEntry.rotation % SHAPES[nextEntry.type].length]
        };
      } else {
        nextPiece = null;
      }
      
      scriptIndex++;
    }
    
    // ============================================================================
    // GAME LOOP
    // ============================================================================
    
    function gameLoop(time = 0) {
      const deltaTime = time - lastTime;
      lastTime = time;
      
      if (gameState === "playing") {
        update(deltaTime);
        render();
      } else if (gameState === "paused") {
        render();
      }
      
      requestAnimationFrame(gameLoop);
    }
    
    function update(deltaTime) {
      if (message) {
        messageTimer += deltaTime;
        if (messageTimer >= CONFIG.MESSAGE_DURATION_MS) {
          message = null;
          messageTimer = 0;
        }
      }
      
      if (cascading) {
        cascadeTimer += deltaTime;
        if (cascadeTimer >= CONFIG.CASCADE_DELAY_MS) {
          cascadeTimer = 0;
          cascading = false;
          checkCascade();
        }
        return;
      }
      
      if (!currentPiece) {
        spawnNextPiece();
        return;
      }
      
      // DISABLED: Rotation during fall ruins solver's precise placements
      // The piece must land at exact rotation specified in SCRIPT
      
      dropCounter += deltaTime;
      const dropSpeed = currentPiece.isKey ? 100 : CONFIG.DROP_SPEED_MS;
      
      if (dropCounter >= dropSpeed) {
        dropCounter = 0;
        
        if (!collides(board, currentPiece.shape, currentPiece.x, currentPiece.y + 1)) {
          currentPiece.y++;
        } else {
          lockPieceToBoard(board, currentPiece.shape, currentPiece.x, currentPiece.y, currentPiece);
          console.log(`Locked: ${currentPiece.label} (Section ${currentPiece.section})`);
          
          const isLastPiece = scriptIndex >= SCRIPT.length;
          currentPiece = null;
          
          if (isLastPiece) {
            console.log("✓ Last piece placed! Game will end after clearing.");
          }
          
          checkLineClears();
        }
      }
    }
    
    function checkLineClears() {
      const clearedRows = [];
      
      for (let row = 0; row < CONFIG.ROWS; row++) {
        if (board[row].every(cell => cell !== null)) {
          clearedRows.push(row);
        }
      }
      
      if (clearedRows.length > 0) {
        console.log(`Clearing ${clearedRows.length} line(s):`, clearedRows);
        
        // Determine which section(s) were cleared
        const sectionsClearedNow = new Set();
        for (const row of clearedRows) {
          for (let col = 0; col < CONFIG.COLS; col++) {
            if (board[row][col]) {
              sectionsClearedNow.add(board[row][col].section);
            }
          }
        }
        
        // Remove cleared lines
        for (const row of clearedRows.reverse()) {
          board.splice(row, 1);
          board.unshift(Array(CONFIG.COLS).fill(null));
        }
        
        linesCleared += clearedRows.length;
        
        if (clearedRows.length === 1) score += CONFIG.SCORE_SINGLE * level;
        else if (clearedRows.length === 2) score += CONFIG.SCORE_DOUBLE * level;
        else if (clearedRows.length === 3) score += CONFIG.SCORE_TRIPLE * level;
        else if (clearedRows.length >= 4) score += CONFIG.SCORE_TETRIS * level;
        
        level = Math.floor(linesCleared / 10) + 1;
        
        // Check if any section is now fully cleared (for tracking only)
        for (const section of [0, 1, 2, 3]) {
          const sectionExists = board.some(row => 
            row.some(cell => cell && cell.section === section)
          );
          
          if (!sectionExists && !clearedSections.has(section)) {
            clearedSections.add(section);
            console.log(`✓ Section ${section} fully cleared!`);
          }
        }
        
        cascading = true;
        cascadeTimer = 0;
      }
    }
    
    function checkCascade() {
      const hasLines = board.some(row => row.every(cell => cell !== null));
      
      if (hasLines) {
        console.log("Cascade continuing...");
        checkLineClears();
      } else {
        const isGameComplete = scriptIndex >= SCRIPT.length;
        
        if (isGameComplete) {
          // Game is complete - show final message then scoreboard
          console.log("✓ All pieces placed! Showing final message...");
          showMessage(CONFIG.FINAL_MESSAGE);
          setTimeout(() => {
            console.log("✓ Showing scoreboard...");
            showScoreboard();
          }, CONFIG.MESSAGE_DURATION_MS);
        } else {
          console.log("Cascade complete, spawning next piece");
          spawnNextPiece();
        }
      }
    }
    
    function showMessage(text) {
      message = text;
      messageTimer = 0;
    }
    
    // ============================================================================
    // RENDERING
    // ============================================================================
    
    function render() {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      drawBoard();
      
      if (currentPiece) {
        drawPiece(currentPiece, currentPiece.x, currentPiece.y);
      }
      
      drawHUD();
      
      if (message) {
        drawMessage();
      }
    }
    
    function drawBoard() {
      const cellSize = CONFIG.CELL_SIZE;
      
      // Grid lines
      ctx.strokeStyle = "#111";
      ctx.lineWidth = 1;
      for (let row = 0; row <= CONFIG.ROWS; row++) {
        ctx.beginPath();
        ctx.moveTo(0, row * cellSize);
        ctx.lineTo(CONFIG.COLS * cellSize, row * cellSize);
        ctx.stroke();
      }
      for (let col = 0; col <= CONFIG.COLS; col++) {
        ctx.beginPath();
        ctx.moveTo(col * cellSize, 0);
        ctx.lineTo(col * cellSize, CONFIG.ROWS * cellSize);
        ctx.stroke();
      }
      
      // Draw locked pieces (cells)
      for (let row = 0; row < CONFIG.ROWS; row++) {
        for (let col = 0; col < CONFIG.COLS; col++) {
          if (board[row][col]) {
            drawCell(col, row, board[row][col].type);
          }
        }
      }
      
      // Draw labels ONCE per piece (group cells by pieceId)
      const drawnPieces = new Set();
      for (let row = 0; row < CONFIG.ROWS; row++) {
        for (let col = 0; col < CONFIG.COLS; col++) {
          const cell = board[row][col];
          if (cell && !drawnPieces.has(cell.pieceId)) {
            drawnPieces.add(cell.pieceId);
            drawLockedPieceLabel(cell.pieceId, cell.label, cell.type);
          }
        }
      }
    }
    
    function drawPiece(piece, x, y) {
      const shape = piece.shape;
      
      for (let row = 0; row < shape.length; row++) {
        for (let col = 0; col < shape[row].length; col++) {
          if (shape[row][col]) {
            drawCell(x + col, y + row, piece.type);
          }
        }
      }
      
      if (piece.label) {
        drawPieceLabel(piece, x, y);
      }
    }
    
    function drawCell(col, row, pieceType) {
      const cellSize = CONFIG.CELL_SIZE;
      const px = col * cellSize;
      const py = row * cellSize;
      const palette = TETRIS_COLORS[pieceType];
      
      ctx.fillStyle = palette.base;
      ctx.fillRect(px, py, cellSize, cellSize);
      
      ctx.fillStyle = palette.light;
      ctx.fillRect(px, py, cellSize, 3);
      ctx.fillRect(px, py, 3, cellSize);
      
      ctx.fillStyle = palette.dark;
      ctx.fillRect(px, py + cellSize - 3, cellSize, 3);
      ctx.fillRect(px + cellSize - 3, py, 3, cellSize);
    }
    
    function drawCellLabel(col, row, label) {
      const cellSize = CONFIG.CELL_SIZE;
      const centerX = (col + 0.5) * cellSize;
      const centerY = (row + 0.5) * cellSize;
      
      let fontSize = 10;
      if (label.length > 12) fontSize = 8;
      
      ctx.font = `bold ${fontSize}px sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      
      ctx.fillStyle = "#000";
      ctx.fillText(label, centerX + 1, centerY + 1);
      
      ctx.fillStyle = "#FFF";
      ctx.fillText(label, centerX, centerY);
    }
    
    function drawLockedPieceLabel(pieceId, label, type) {
      const cellSize = CONFIG.CELL_SIZE;
      
      // Find all cells belonging to this piece
      let minCol = CONFIG.COLS, maxCol = -1, minRow = CONFIG.ROWS, maxRow = -1;
      for (let row = 0; row < CONFIG.ROWS; row++) {
        for (let col = 0; col < CONFIG.COLS; col++) {
          if (board[row][col] && board[row][col].pieceId === pieceId) {
            minCol = Math.min(minCol, col);
            maxCol = Math.max(maxCol, col);
            minRow = Math.min(minRow, row);
            maxRow = Math.max(maxRow, row);
          }
        }
      }
      
      // Draw label centered on entire piece
      const centerX = (minCol + maxCol + 1) * cellSize / 2;
      const centerY = (minRow + maxRow + 1) * cellSize / 2;
      
      // Larger, more legible font sizes
      let fontSize = 16;
      if (label.length > 10) fontSize = 14;
      if (label.length > 12) fontSize = 13;
      if (label.length > 14) fontSize = 11;
      if (label.length > 16) fontSize = 10;
      
      ctx.font = `bold ${fontSize}px sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      
      ctx.fillStyle = "#000";
      ctx.fillText(label, centerX + 1, centerY + 1);
      
      ctx.fillStyle = "#FFF";
      ctx.fillText(label, centerX, centerY);
    }
    
    function drawPieceLabel(piece, x, y) {
      const shape = piece.shape;
      const cellSize = CONFIG.CELL_SIZE;
      
      let minCol = 4, maxCol = -1, minRow = 4, maxRow = -1;
      for (let row = 0; row < shape.length; row++) {
        for (let col = 0; col < shape[row].length; col++) {
          if (shape[row][col]) {
            minCol = Math.min(minCol, col);
            maxCol = Math.max(maxCol, col);
            minRow = Math.min(minRow, row);
            maxRow = Math.max(maxRow, row);
          }
        }
      }
      
      const centerX = (x + minCol + (maxCol - minCol) / 2 + 0.5) * cellSize;
      const centerY = (y + minRow + (maxRow - minRow) / 2 + 0.5) * cellSize;
      
      // Larger, more legible font sizes
      let fontSize = 16;
      if (piece.label.length > 10) fontSize = 14;
      if (piece.label.length > 12) fontSize = 13;
      if (piece.label.length > 14) fontSize = 11;
      if (piece.label.length > 16) fontSize = 10;
      
      ctx.font = `bold ${fontSize}px sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      
      ctx.fillStyle = "#000";
      ctx.fillText(piece.label, centerX + 1, centerY + 1);
      
      ctx.fillStyle = "#FFF";
      ctx.fillText(piece.label, centerX, centerY);
    }

    // ============================================================================
    
    function initAudio() {
      try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        // iOS requires user gesture to start audio context
        if (audioContext.state === 'suspended') {
          audioContext.resume().then(() => {
            console.log('Audio context resumed');
            startMusic();
          }).catch(e => {
            console.warn('Could not resume audio context', e);
          });
        } else {
          startMusic();
        }
      } catch (e) {
        console.warn("Web Audio not supported", e);
      }
    }
    
    function startMusic() {
      if (!audioContext) return;
      
      // Complete Korobeiniki (Tetris Theme) melody
      const melody = [
        // Part A
        { note: 659, duration: 0.4 }, // E
        { note: 494, duration: 0.2 }, // B
        { note: 523, duration: 0.2 }, // C
        { note: 587, duration: 0.4 }, // D
        { note: 523, duration: 0.2 }, // C
        { note: 494, duration: 0.2 }, // B
        { note: 440, duration: 0.4 }, // A
        { note: 440, duration: 0.2 }, // A
        { note: 523, duration: 0.2 }, // C
        { note: 659, duration: 0.4 }, // E
        { note: 587, duration: 0.2 }, // D
        { note: 523, duration: 0.2 }, // C
        { note: 494, duration: 0.6 }, // B
        { note: 523, duration: 0.2 }, // C
        { note: 587, duration: 0.4 }, // D
        { note: 659, duration: 0.4 }, // E
        { note: 523, duration: 0.4 }, // C
        { note: 440, duration: 0.4 }, // A
        { note: 440, duration: 0.4 }, // A
        { note: 0, duration: 0.2 },   // Rest
        
        // Part B
        { note: 587, duration: 0.4 }, // D
        { note: 698, duration: 0.2 }, // F
        { note: 880, duration: 0.4 }, // A
        { note: 784, duration: 0.2 }, // G
        { note: 698, duration: 0.2 }, // F
        { note: 659, duration: 0.6 }, // E
        { note: 523, duration: 0.2 }, // C
        { note: 659, duration: 0.4 }, // E
        { note: 587, duration: 0.2 }, // D
        { note: 523, duration: 0.2 }, // C
        { note: 494, duration: 0.4 }, // B
        { note: 494, duration: 0.2 }, // B
        { note: 523, duration: 0.2 }, // C
        { note: 587, duration: 0.4 }, // D
        { note: 659, duration: 0.4 }, // E
        { note: 523, duration: 0.4 }, // C
        { note: 440, duration: 0.4 }, // A
        { note: 440, duration: 0.4 }, // A
        { note: 0, duration: 0.4 }    // Rest
      ];
      
      let time = audioContext.currentTime;
      
      function playLoop() {
        // Clear old oscillators
        activeOscillators = [];
        
        melody.forEach(({ note, duration }) => {
          if (note > 0) {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            
            osc.type = "square";
            osc.frequency.value = note;
            
            gain.gain.value = 0.08;
            gain.gain.exponentialRampToValueAtTime(0.01, time + duration);
            
            osc.connect(gain);
            gain.connect(audioContext.destination);
            
            osc.start(time);
            osc.stop(time + duration);
            
            activeOscillators.push(osc);
          }
          
          time += duration;
        });
        
        const loopDuration = melody.reduce((sum, { duration }) => sum + duration, 0);
        musicLoopTimeout = setTimeout(playLoop, loopDuration * 1000);
      }
      
      playLoop();
    }
    
    function pauseAudio() {
      if (audioContext && audioContext.state === "running") {
        audioContext.suspend();
        
        // Stop all active oscillators
        activeOscillators.forEach(osc => {
          try { osc.stop(); } catch (e) {}
        });
        activeOscillators = [];
        
        // Clear loop timeout
        if (musicLoopTimeout) {
          clearTimeout(musicLoopTimeout);
          musicLoopTimeout = null;
        }
      }
    }
    
    function resumeAudio() {
      if (audioContext && audioContext.state === "suspended") {
        audioContext.resume();
        // Restart music loop after resuming
        if (!musicLoopTimeout) {
          startMusic();
        }
      }
    }
